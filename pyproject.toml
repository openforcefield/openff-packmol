[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.3",
  "setuptools-scm>=8",
]

[project]
name = "openff-packmol"
description = "A Packmol wrapper using OpenFF objects"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Open Force Field Initiative", email = "info@openforcefield.org" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]

[tool.setuptools]
packages.find.include = [ "openff.packmol*" ]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 119
namespace-packages = [ "openff/packmol/" ]
lint.select = [ "E", "F", "I", "NPY", "RUF", "UP", "W" ]

[tool.mypy]
exclude = "openff/packmol/_tests"
python_version = "3.12"
warn_unused_ignores = true
warn_unused_configs = true
overrides = [ { module = [
    "openff.toolkit",
  ], ignore_missing_imports = true } ]
show_error_codes = true

[tool.pytest]
ini_options.addopts = "-n logical -x --cov=openff/packmol --cov-report=xml"

[tool.coverage]
run.omit = [
  "*/*/_tests/*",
]
report.exclude_lines = [
  "@overload",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
